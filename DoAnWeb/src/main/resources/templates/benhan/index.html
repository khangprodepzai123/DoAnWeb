<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Bệnh án')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<th:block th:replace="~{fragments/layout :: alerts}"></th:block>
<div class="page-header"><div class="container d-flex justify-content-between">
    <h1 class="h2 text-primary"><i class="bi bi-file-earmark-medical"></i> Hồ sơ bệnh án</h1>
    <a th:href="@{/benhan/create}" class="btn btn-primary">Tạo từ phiếu khám</a>
</div></div>
<div class="container mb-5"><table class="table table-hover card"><thead class="table-light"><tr>
    <th>Mã BA</th><th>Mã khám</th><th>Bệnh nhân</th><th>Chẩn đoán</th><th></th>
</tr></thead><tbody>
<tr th:each="x : ${items}">
    <td th:text="${x.maBenhAn}"></td><td th:text="${x.maKham}"></td>
    <td th:text="${x.hoTenBn} ?: x.maBn"></td><td th:text="${x.chuanDoan} ?: '-'"></td>
    <td class="text-end">
        <a th:href="@{/benhan/detail/{id}(id=${x.maBenhAn})}" class="btn btn-sm btn-outline-primary">Xem</a>
        <a th:href="@{/benhan/delete/{id}(id=${x.maBenhAn})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa?')">Xóa</a>
    </td>
</tr></tbody></table></div>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Quản lý bệnh nhân')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<th:block th:replace="~{fragments/layout :: alerts}"></th:block>

<div class="page-header">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
            <h1 class="h2 text-primary mb-0"><i class="bi bi-people"></i> Danh sách bệnh nhân</h1>
        </div>
        <a th:href="@{/benhnhan/create}" class="btn btn-primary">
            <i class="bi bi-person-plus"></i> Thêm bệnh nhân
        </a>
    </div>
</div>

<div class="container mb-5">
    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/benhnhan}" method="get" class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label class="form-label">Tìm theo tên</label>
                    <input type="text" name="keyword" class="form-control"
                           th:value="${keyword}" placeholder="Nhập họ tên bệnh nhân..."/>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-search"></i> Tìm
                    </button>
                    <a th:href="@{/benhnhan}" class="btn btn-outline-secondary">Xóa lọc</a>
                </div>
            </form>
        </div>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Mã BN</th>
                        <th>Họ tên</th>
                        <th>SĐT</th>
                        <th>Ngày sinh</th>
                        <th>Giới tính</th>
                        <th>Địa chỉ</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(benhNhans)}">
                        <td colspan="7" class="text-center text-muted py-4"
                            th:text="${keyword != null and !#strings.isEmpty(keyword)} ? 'Không tìm thấy bệnh nhân.' : 'Chưa có bệnh nhân nào.'">
                        </td>
                    </tr>
                    <tr th:each="bn : ${benhNhans}">
                        <td th:text="${bn.maBn}">BN001</td>
                        <td th:text="${bn.hoTenBn}">Nguyễn Văn A</td>
                        <td th:text="${bn.sdt}">0900000000</td>
                        <td th:text="${bn.ngaySinh != null ? #temporals.format(bn.ngaySinh, 'dd/MM/yyyy') : '-'}">-</td>
                        <td th:text="${bn.gt} ?: '-'">Nam</td>
                        <td th:text="${bn.diaChi} ?: '-'">-</td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/khambenh/dangky/{id}(id=${bn.maBn})}" class="btn btn-sm btn-outline-info" title="Đăng ký khám">
                                <i class="bi bi-calendar-plus"></i>
                            </a>
                            <a th:href="@{/thanhtoan/{id}(id=${bn.maBn})}" class="btn btn-sm btn-outline-success" title="Thanh toán">
                                <i class="bi bi-credit-card"></i>
                            </a>
                            <a th:href="@{/benhnhan/edit/{id}(id=${bn.maBn})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i> Sửa
                            </a>
                            <a th:href="@{/benhnhan/delete/{id}(id=${bn.maBn})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Xóa bệnh nhân này?');">
                                <i class="bi bi-trash"></i> Xóa
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Lỗi')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>

<div class="container my-5">
    <div class="alert alert-danger">
        <h4 class="alert-heading"><i class="bi bi-exclamation-octagon"></i> Đã xảy ra lỗi</h4>
        <p th:text="${error} ?: 'Vui lòng thử lại sau.'">Lỗi không xác định</p>
        <hr/>
        <a th:href="@{/}" class="btn btn-primary">Về trang chủ</a>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

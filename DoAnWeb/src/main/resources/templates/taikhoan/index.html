<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Tài khoản')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<th:block th:replace="~{fragments/layout :: alerts}"></th:block>
<div class="page-header"><div class="container d-flex justify-content-between">
    <h1 class="h2 text-primary"><i class="bi bi-person-badge"></i> Tài khoản</h1>
    <a th:href="@{/taikhoan/create}" class="btn btn-primary">Thêm tài khoản</a>
</div></div>
<div class="container mb-5"><table class="table table-hover card"><thead class="table-light"><tr>
    <th>Mã TK</th><th>Đăng nhập</th><th>Vai trò</th><th>Điểm</th><th>Mã BN</th><th></th>
</tr></thead><tbody>
<tr th:each="x : ${items}">
    <td th:text="${x.maTk}"></td><td th:text="${x.tenDangNhap}"></td>
    <td th:text="${x.vaiTro}"></td><td th:text="${x.diemTichLuy}"></td><td th:text="${x.maBn} ?: '-'"></td>
    <td class="text-end">
        <a th:href="@{/taikhoan/edit/{id}(id=${x.maTk})}" class="btn btn-sm btn-outline-primary">Sửa</a>
        <a th:href="@{/taikhoan/delete/{id}(id=${x.maTk})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa?')">Xóa</a>
    </td>
</tr></tbody></table></div>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>

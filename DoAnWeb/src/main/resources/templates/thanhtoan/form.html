<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Thanh toán')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<th:block th:replace="~{fragments/layout :: alerts}"></th:block>
<div class="container my-4">
    <div class="card mb-3"><div class="card-body">
        <h3>Thanh toán — <span th:text="${thanhToan.hoTenBn}"></span></h3>
        <p>Mã khám: <span th:text="${thanhToan.maKham}"></span></p>
        <p class="fs-4 text-primary">Tổng thanh toán: <strong th:text="${#numbers.formatDecimal(thanhToan.tongTien,0,'COMMA',0,'POINT')}"></strong> VNĐ</p>
        <p th:if="${thanhToan.diemTichLuyHienCo >= 1}" class="text-muted">
            Điểm tích lũy hiện có: <span th:text="${thanhToan.diemTichLuyHienCo}"></span>
            (tick dùng điểm để giảm 10%)
        </p>
    </div></div>
    <table class="table card mb-3" th:if="${!#lists.isEmpty(thanhToan.chiTiets)}">
        <thead><tr><th>Thuốc</th><th>SL</th><th>Thành tiền</th></tr></thead>
        <tbody>
        <tr th:each="ct : ${thanhToan.chiTiets}">
            <td th:text="${ct.tenThuoc}"></td>
            <td th:text="${ct.soLuong}"></td>
            <td th:text="${#numbers.formatDecimal(ct.thanhTien,0,'COMMA',0,'POINT')}"></td>
        </tr>
        </tbody>
    </table>
    <form th:action="@{/thanhtoan/{maBn}(maBn=${maBn})}" method="post" class="card card-body">
        <div class="form-check mb-3" th:if="${thanhToan.diemTichLuyHienCo >= 1}">
            <input class="form-check-input" type="checkbox" name="dungDiem" value="true" id="dungDiem"/>
            <label class="form-check-label" for="dungDiem">Dùng 1 điểm tích lũy (giảm 10%)</label>
        </div>
        <button type="submit" class="btn btn-success btn-lg"><i class="bi bi-credit-card"></i> Xác nhận thanh toán</button>
        <a th:href="@{/benhnhan}" class="btn btn-secondary">Hủy</a>
    </form>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>

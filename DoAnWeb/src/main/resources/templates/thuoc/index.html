<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Danh sách thuốc')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<th:block th:replace="~{fragments/layout :: alerts}"></th:block>
<div class="page-header"><div class="container d-flex justify-content-between">
    <h1 class="h2 text-primary"><i class="bi bi-capsule"></i> Thuốc</h1>
    <a th:href="@{/thuoc/create}" class="btn btn-primary">Thêm thuốc</a>
</div></div>
<div class="container mb-5"><table class="table table-hover card"><thead class="table-light"><tr>
    <th>Mã</th><th>Tên thuốc</th><th>Giá</th><th>Tồn</th><th></th>
</tr></thead><tbody>
<tr th:each="x : ${items}">
    <td th:text="${x.maThuoc}"></td><td th:text="${x.tenThuoc}"></td>
    <td th:text="${#numbers.formatDecimal(x.giaBan,0,'COMMA',0,'POINT')}"></td>
    <td th:text="${x.soLuong}"></td>
    <td class="text-end">
        <a th:href="@{/thuoc/edit/{id}(id=${x.maThuoc})}" class="btn btn-sm btn-outline-primary">Sửa</a>
        <a th:href="@{/thuoc/delete/{id}(id=${x.maThuoc})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa?')">Xóa</a>
    </td>
</tr></tbody></table></div>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
